[project]
name = "ces-genesys-adapter"
version = "0.1.0"
description = "Genesys Cloud AudioHook to Google CX Agent Studio adapter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "uvloop>=0.19.0",
    "websockets>=10.0",
    "python-dotenv",
    "google-auth",
    "google-cloud-secret-manager",
    "google-cloud-dialogflow>=2.43.0,<3",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pyink>=26.5.1",
    "pylint>=4.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Google Python Style Guide formatting (https://google.github.io/styleguide/pyguide.html):
# 80 columns, 4-space indentation. Lint rules live in .pylintrc.
[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
target-version = ["py313"]

[tool.isort]
profile = "google"
line_length = 80
